# LUKS2: bootc state = per-deployment /etc + shared /var (/home, k3s, logs).
# Mounted at /sysroot/state in the initrd, before bootc-root-setup.service.
# Generic Linux type on purpose so gpt-auto ignores it.
[Partition]
Type=linux-generic
Label=state
Format=ext4
Encrypt=key-file
SizeMinBytes=16G
# Shares the free space with 40-public.conf (equal weights); 256G NVMe:
# ~98G each. Capped so a larger disk leaves the rest to public.
SizeMaxBytes=100G
