[Unit]
Requires=labhf-kubernetes-prepare.service
Wants=kube-apiserver.service
After=kube-apiserver.service labhf-kubernetes-prepare.service
PartOf=labhf-kubernetes.target

[Service]
User=root
ExecStart=
ExecStart=/usr/bin/kube-scheduler \
    --bind-address=127.0.0.1 \
    --kubeconfig=/var/lib/labhf-kubernetes/credentials/scheduler.conf \
    --authentication-kubeconfig=/var/lib/labhf-kubernetes/credentials/scheduler.conf \
    --authorization-kubeconfig=/var/lib/labhf-kubernetes/credentials/scheduler.conf
RestartSec=5s
