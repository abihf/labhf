[Unit]
Requires=labhf-kubernetes-prepare.service
Wants=kube-apiserver.service
After=kube-apiserver.service labhf-kubernetes-prepare.service
PartOf=labhf-kubernetes.target

[Service]
ExecStart=
ExecStart=/usr/bin/kube-proxy \
    --kubeconfig=/var/lib/labhf-kubernetes/credentials/proxy.conf \
    --proxy-mode=iptables --cluster-cidr=10.42.0.0/16
RestartSec=5s
