[Unit]
Requires=labhf-kubernetes-prepare.service
Wants=kube-apiserver.service crio.service
After=kube-apiserver.service crio.service labhf-kubernetes-prepare.service
PartOf=labhf-kubernetes.target

[Service]
EnvironmentFile=/run/labhf-kubernetes/node.env
ExecStart=
ExecStart=/usr/bin/kubelet \
    --config=/etc/kubernetes/labhf-kubelet.yaml \
    --kubeconfig=/var/lib/kubelet/labhf-kubelet.conf \
    --cert-dir=/var/lib/kubelet/labhf-pki \
    --node-ip=${LABHF_KUBE_ADDRESS}
