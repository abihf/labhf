[Unit]
Requires=labhf-kubernetes-prepare.service
Wants=kube-apiserver.service
After=kube-apiserver.service labhf-kubernetes-prepare.service
PartOf=labhf-kubernetes.target

[Service]
User=root
ExecStart=
ExecStart=/usr/bin/kube-controller-manager \
    --bind-address=127.0.0.1 \
    --kubeconfig=/var/lib/labhf-kubernetes/credentials/controller-manager.conf \
    --authentication-kubeconfig=/var/lib/labhf-kubernetes/credentials/controller-manager.conf \
    --authorization-kubeconfig=/var/lib/labhf-kubernetes/credentials/controller-manager.conf \
    --root-ca-file=/var/lib/labhf-kubernetes/credentials/pki/ca.crt \
    --cluster-signing-cert-file=/var/lib/labhf-kubernetes/credentials/pki/ca.crt \
    --cluster-signing-key-file=/var/lib/labhf-kubernetes/credentials/pki/ca.key \
    --service-account-private-key-file=/var/lib/labhf-kubernetes/credentials/pki/sa.key \
    --use-service-account-credentials=true \
    --allocate-node-cidrs=true --cluster-cidr=10.42.0.0/16 --node-cidr-mask-size-ipv4=24
RestartSec=5s
