[Unit]
Requires=labhf-kine.service
After=labhf-kine.service
PartOf=labhf-kubernetes.target

[Service]
Type=exec
User=root
EnvironmentFile=/run/labhf-kubernetes/node.env
ExecStart=
ExecStart=/usr/bin/kube-apiserver \
    --advertise-address=${LABHF_KUBE_ADDRESS} \
    --etcd-servers=unix:///run/labhf-kine/kine.sock \
    --service-cluster-ip-range=10.43.0.0/16 \
    --authorization-mode=Node,RBAC \
    --enable-admission-plugins=NodeRestriction \
    --allow-privileged=true \
    --client-ca-file=/var/lib/labhf-kubernetes/credentials/pki/ca.crt \
    --tls-cert-file=/var/lib/labhf-kubernetes/credentials/pki/apiserver.crt \
    --tls-private-key-file=/var/lib/labhf-kubernetes/credentials/pki/apiserver.key \
    --kubelet-client-certificate=/var/lib/labhf-kubernetes/credentials/pki/apiserver-kubelet-client.crt \
    --kubelet-client-key=/var/lib/labhf-kubernetes/credentials/pki/apiserver-kubelet-client.key \
    --kubelet-preferred-address-types=InternalIP,Hostname,ExternalIP \
    --service-account-issuer=https://kubernetes.default.svc.cluster.local \
    --service-account-key-file=/var/lib/labhf-kubernetes/credentials/pki/sa.pub \
    --service-account-signing-key-file=/var/lib/labhf-kubernetes/credentials/pki/sa.key \
    --requestheader-client-ca-file=/var/lib/labhf-kubernetes/credentials/pki/front-proxy-ca.crt \
    --requestheader-allowed-names=front-proxy-client \
    --requestheader-extra-headers-prefix=X-Remote-Extra- \
    --requestheader-group-headers=X-Remote-Group \
    --requestheader-username-headers=X-Remote-User \
    --proxy-client-cert-file=/var/lib/labhf-kubernetes/credentials/pki/front-proxy-client.crt \
    --proxy-client-key-file=/var/lib/labhf-kubernetes/credentials/pki/front-proxy-client.key \
    --enable-aggregator-routing=true \
    --encryption-provider-config=/var/lib/labhf-kubernetes/credentials/encryption.yaml \
    --admission-control-config-file=/etc/kubernetes/pod-security.yaml \
    --audit-policy-file=/etc/kubernetes/audit-policy.yaml \
    --audit-log-path=/var/lib/labhf-kubernetes/logs/audit.log \
    --audit-log-maxage=30 --audit-log-maxbackup=5 --audit-log-maxsize=100
RestartSec=5s
