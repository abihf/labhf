# No local DNS listeners (127.0.0.53, 127.0.0.54): /etc/resolv.conf lists the
# network's DNS servers directly (see build/finalize.sh), and port 53 on the
# host is left to a DNS server in the cluster (a k3s LoadBalancer/hostPort on
# 53 DNATs every local address anyway). resolved still collects the DNS
# servers from networkd (static or DHCP) and serves glibc via nss-resolve.
[Resolve]
DNSStubListener=no
