d /var/home/abi 0700 abi abi -
d /var/home/gui 0700 gui gui -
d /var/lib/labhf 0700 root root -
# Fast shared data on the encrypted state volume; /media/public -> /home/public
# (symlink in the image) keeps the k3s hostPath. Labelled container_file_t
# (finalize.sh) so pods may use it with SELinux enforcing.
d /var/home/public 0755 abi abi -
