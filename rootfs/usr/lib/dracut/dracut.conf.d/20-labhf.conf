# composefs mount logic from bootc
add_dracutmodules+=" bootc "
# LUKS state volume unlocked via TPM2
add_dracutmodules+=" crypt systemd-cryptsetup tpm2-tss "
install_items+=" /etc/crypttab "
# crypttab tpm2-measure-pcr=yes talks varlink to systemd-pcrextend; dracut's
# systemd-pcrphase module ships only the binary, so without the socket the
# volume key is never measured into PCR 15 ("Could not extend PCR: ENOENT").
install_items+=" /usr/lib/systemd/system/systemd-pcrextend.socket /usr/lib/systemd/system/systemd-pcrextend@.service /usr/lib/systemd/system/sockets.target.wants/systemd-pcrextend.socket "
# mount /sysroot/state before bootc-root-setup.service
install_items+=" /usr/lib/systemd/system/sysroot-state.mount /usr/lib/systemd/system/bootc-root-setup.service.d/50-labhf-state.conf "
# image mode uses nss-altfiles
install_items+=" /usr/lib/passwd /usr/lib/group "
# not needed in the initrd; nvidia loads from the real root
omit_drivers+=" nouveau nvidia nvidia_drm nvidia_modeset nvidia_uvm "
omit_dracutmodules+=" fips fips-crypto-policies lunmask lvm memstrack nss-softokn "
omit_dracutmodules+=" clevis network network-manager "
