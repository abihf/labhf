# Keys written at install time go here (root's home is on /var).
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%u
PasswordAuthentication no
KbdInteractiveAuthentication no
# Administer as abi + sudo (which asks for the password)
PermitRootLogin no
AllowUsers abi
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
# local only: `ssh -L 6443:localhost:6443` for kubectl, the API is firewalled
AllowTcpForwarding local
MaxAuthTries 3
LoginGraceTime 20
