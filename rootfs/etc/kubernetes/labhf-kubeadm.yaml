apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  # Replaced with the node address by kubernetes-prepare.
  advertiseAddress: 192.0.2.1
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: v1.37.0
controlPlaneEndpoint: localhost:6443
certificatesDir: /var/lib/labhf-kubernetes/credentials/pki
apiServer:
  certSANs:
    - localhost
    - 127.0.0.1
networking:
  serviceSubnet: 10.43.0.0/16
  podSubnet: 10.42.0.0/16
  dnsDomain: cluster.local
