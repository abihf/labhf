[crio.runtime]
cgroup_manager = "systemd"
selinux = true
# Keep CRI-O's namespace mounts separate from ip netns and its shared mount.
namespaces_dir = "/run/crio/ns"

[crio.runtime.runtimes.nvidia]
runtime_path = "/usr/bin/nvidia-container-runtime"
runtime_type = "oci"

[crio.network]
plugin_dirs = ["/usr/libexec/cni"]
cni_default_network = "labhf"
