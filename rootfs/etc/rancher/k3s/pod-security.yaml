# Pod Security: report anything above "baseline", don't block it. baseline
# forbids hostPath, which the media apps here rely on. To enforce on a
# namespace: kubectl label ns NAME pod-security.kubernetes.io/enforce=baseline
apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
  - name: PodSecurity
    configuration:
      apiVersion: pod-security.admission.config.k8s.io/v1
      kind: PodSecurityConfiguration
      defaults:
        enforce: privileged
        enforce-version: latest
        audit: baseline
        audit-version: latest
        warn: baseline
        warn-version: latest
      exemptions:
        namespaces: [kube-system]
