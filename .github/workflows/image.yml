# SPDX-License-Identifier: GPL-3.0-or-later
# Build the sealed labhf image and push it to ghcr.io/<owner>/labhf.
#
# Repository secrets (see README "CI: GitHub Actions"):
#   SB_DB_KEY    keys/db.key  (Secure Boot db private key; PK/KEK stay offline)
#   SB_DB_CRT    keys/db.crt
#   SB_AUTH_TGZ  base64 tar.gz of keys/auth/ (public PK/KEK/db .auth files)
name: image

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'LICENSE']
  schedule:
    - cron: '23 3 * * 1'   # weekly rebuild: Fedora, NVIDIA and security updates
  workflow_dispatch:
  # No pull_request trigger: fork PRs get no secrets, and the db key must never
  # be exposed to code from a PR.

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      # third-party code pinned by commit / digest: this job holds the db key
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's disk (~145G, ~75G free) is plenty for the build (~25G);
      # deleting preinstalled SDKs took 2.5 minutes for nothing. Fail early
      # instead if a runner image ever ships with much less.
      - name: Check disk space
        run: |
          df -h / /mnt
          free_gb=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          (( free_gb >= 40 )) || { echo "::error::only ${free_gb}G free on /mnt, need 40G"; exit 1; }

      - name: Restore Secure Boot signing material
        env:
          SB_DB_KEY: ${{ secrets.SB_DB_KEY }}
          SB_DB_CRT: ${{ secrets.SB_DB_CRT }}
          SB_AUTH_TGZ: ${{ secrets.SB_AUTH_TGZ }}
        run: |
          for v in SB_DB_KEY SB_DB_CRT SB_AUTH_TGZ; do
            [[ -n ${!v} ]] || { echo "::error::repository secret $v is not set"; exit 1; }
          done
          umask 077
          mkdir -p keys
          printf '%s\n' "$SB_DB_KEY" > keys/db.key
          printf '%s\n' "$SB_DB_CRT" > keys/db.crt
          base64 -d <<<"$SB_AUTH_TGZ" | tar -xz -C keys
          ls keys/auth/PK.auth keys/auth/KEK.auth keys/auth/db.auth >/dev/null
          # key and certificate must belong together
          [[ $(openssl x509 -in keys/db.crt -noout -pubkey | sha256sum) == \
             $(openssl pkey -in keys/db.key -pubout | sha256sum) ]] \
            || { echo "::error::SB_DB_KEY does not match SB_DB_CRT"; exit 1; }
          openssl x509 -in keys/db.crt -noout -subject -enddate

      - name: Compute tags
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/labhf"
          tags="sha-${GITHUB_SHA::7}"
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            tags+=" latest $(date -u +%Y%m%d)"
          else
            branch=${GITHUB_REF_NAME//[^a-zA-Z0-9_.-]/-}
            tags+=" ${branch,,}"
          fi
          echo "IMAGE_REPO=$repo" >> "$GITHUB_ENV"
          echo "TAGS=$tags" >> "$GITHUB_ENV"
          # no SOURCE_DATE_EPOCH: make build takes the packages' (layers then
          # change with packages, not with every commit)
          echo "Pushing $repo: $tags"

      # Ubuntu 26.04's own podman (5.x); runs on the runner, no nested container
      - name: Install podman
        uses: redhat-actions/podman-install@4a5b244246ee7d71f896e53bbde9d98a503ddb9b # main, 2026-10-19 (after v1.1.1)

      # rootful (as the build ran before, as root in a privileged container):
      # image storage on /mnt, the disk checked above
      - name: Configure container storage
        run: |
          podman --version
          sudo mkdir -p /mnt/containers /etc/containers
          sudo tee /etc/containers/storage.conf >/dev/null <<'EOF'
          [storage]
          driver = "overlay"
          runroot = "/run/containers/storage"
          graphroot = "/mnt/containers"
          EOF
          sudo podman info --format '{{.Store.GraphRoot}} {{.Store.GraphDriverName}}'

      - name: Build and push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_LABELS: >-
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            --label org.opencontainers.image.revision=${{ github.sha }}
            --label org.opencontainers.image.licenses=GPL-3.0-or-later
        run: |
          sudo --preserve-env=IMAGE_REPO,TAGS,REGISTRY_USER,REGISTRY_TOKEN,BUILD_LABELS \
            bash scripts/ci-build.sh

      - name: Remove signing material
        if: always()
        run: rm -rf keys
